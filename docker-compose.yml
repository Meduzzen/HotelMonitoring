services:
  mediamtx:
    image: bluenviron/mediamtx:1.19.2
    env_file:
      - .env
    container_name: mediamtx
    ports:
      - 8554:8554
    volumes:
      - ./resources/mediamtx.yml:/mediamtx.yml
    networks:
      - kate_hotel
    restart: unless-stopped

  reid-tracker:
    image: reid-people
    container_name: reid-people-api
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - kate_hotel
    volumes:
      - ./models:/app/models
      - ./main.py:/app/main.py

networks:
  kate_hotel:
